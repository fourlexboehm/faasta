[package]
name = "faasta"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Faasta SDK for WASI HTTP functions"

[dependencies]
anyhow = "1.0.104"
faasta-macros = { version = "0.2.0", path = "../macros" }
omnia-wasi-sql = { git = "https://github.com/augentic/omnia", rev = "9c56ba523b0e22ad7d835ca80e050603a4aeaecf" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasip3 = { version = "0.9.0" }
wit-bindgen = { version = "0.63.0", features = ["async", "async-spawn"], default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
omnia-wasi-blobstore = { git = "https://github.com/augentic/omnia", rev = "9c56ba523b0e22ad7d835ca80e050603a4aeaecf" }
omnia-wasi-keyvalue = { git = "https://github.com/augentic/omnia", rev = "9c56ba523b0e22ad7d835ca80e050603a4aeaecf" }
