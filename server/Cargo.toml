[package]
name = "server"
version = "0.2.0"
edition = "2024"
autobins = false

[dependencies]
anyhow = "1.0.104"
aws-sdk-s3 = "1.152.0"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
# Bincode 3.0.0 is a compile-error retirement placeholder; 2.0.1 is the latest usable release.
bincode = "2.0.1"
bitrpc = { version = "0.4.0", features = ["tokio"] }
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
dashmap = "6.2.1"
deadpool-postgres = "0.14.2"
dotenvy = "0.15.7"
faasta-interface = { path = "../interface" }
futures-util = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["full"] }
lazy_static = "1.5.1"
once_cell = "1.21.4"
# Pin Omnia 0.37 (Wasmtime 49) until it is published to crates.io.
omnia = { git = "https://github.com/augentic/omnia", rev = "9c56ba523b0e22ad7d835ca80e050603a4aeaecf" }
omnia-wasi-blobstore = { git = "https://github.com/augentic/omnia", rev = "9c56ba523b0e22ad7d835ca80e050603a4aeaecf" }
omnia-wasi-keyvalue = { git = "https://github.com/augentic/omnia", rev = "9c56ba523b0e22ad7d835ca80e050603a4aeaecf" }
omnia-wasi-sql = { git = "https://github.com/augentic/omnia", rev = "9c56ba523b0e22ad7d835ca80e050603a4aeaecf" }
redis = { version = "1.7.1", features = ["aio", "tokio-comp", "connection-manager", "cluster-async"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.46", features = ["ring"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "net", "sync", "fs", "io-util"] }
tokio-postgres = "0.7.18"
tower = { version = "0.5.3", features = ["timeout"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wasmtime = "49.0.4"
wasmtime-wasi = { version = "49.0.4", features = ["p3"] }
wasmtime-wasi-http = { version = "49.0.4", default-features = false, features = ["default-send-request", "p3", "component-model-async"] }
x509-parser = "0.18.1"

[[bin]]
name = "faasta-server"
path = "src/main.rs"
