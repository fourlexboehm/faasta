[package]
name = "faasta-interface"
version = "0.2.0"
edition = "2024"
description = "bitrpc types for the faasta serverless platform"
license = "MIT"

[dependencies]
# Bincode 3.0.0 is a compile-error retirement placeholder; 2.0.1 is the latest usable release.
bincode = "2.0.1"
bitrpc = "0.4.0"
bitcode = "0.6.9"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
