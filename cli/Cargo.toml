[package]
name = "cargo-faasta"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Build and deploy wasi-http wasm to the faasta serverless platform"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
bitrpc = { version = "0.4.0", features = ["tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
clap-cargo = "0.19.0"
compio = { version = "0.19.2", features = ["macros", "time"] }
compio-driver = { version = "0.12.5", features = ["io-uring"] }
cyper = { version = "0.9.0", features = ["json", "rustls"] }
dirs = "7.0.0"
faasta-interface = { path = "../interface", version = "0.2.0" }
github-app-auth = "3.0.1"
http = "1.5.0"
indicatif = "0.18.6"
oauth2 = { version = "5.0.0", default-features = false }
open = "5.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
tiny_http = "0.12.0"
tracing = "0.1.44"
url = "2.5.8"
