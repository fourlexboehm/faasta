[package]
name = "faasta"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Faasta SDK for WASI HTTP functions"

[dependencies]
anyhow = "1"
faasta-macros = { version = "0.2.0", path = "../macros" }
omnia-wasi-blobstore = { git = "https://github.com/augentic/omnia", rev = "c8af06a3920c871618be24633ca6cc31441c8d39" }
omnia-wasi-keyvalue = { git = "https://github.com/augentic/omnia", rev = "c8af06a3920c871618be24633ca6cc31441c8d39" }
omnia-wasi-sql = { git = "https://github.com/augentic/omnia", rev = "c8af06a3920c871618be24633ca6cc31441c8d39" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasip3 = { version = "0.8.0" }
wit-bindgen = { version = "0.61.0", features = ["async", "async-spawn"], default-features = false }
